<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustShield</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 1.1rem; margin: 0 0 8px 0; }
    p { font-size: 0.85rem; color: #cbd5e1; margin: 0 0 12px 0; }
    textarea { width: 100%; height: 80px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; padding: 8px; box-sizing: border-box; }
    button { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 8px; background: #10b981; color: #022c22; font-weight: 700; cursor: pointer; }
    .result { margin-top: 12px; padding: 10px; border-radius: 8px; background: #1e293b; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>TrustShield Risk Check</h1>
  <p>Paste a suspicious message, link, or extortion prompt to evaluate risk signals.</p>
  <textarea id="sampleInput" placeholder="Paste message or URL here..."></textarea>
  <button id="checkBtn">Analyze Risk</button>
  <div id="resultBox" class="result">Risk score: Ready</div>
  <script src="popup.js"></script>
</body>
</html>
